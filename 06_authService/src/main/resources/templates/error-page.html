<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .card {
            padding: 45px 42px;
            border-radius: 14px;
            text-align: center;
        }

        .error-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #fef2f2;
            color: #dc2626;
            font-size: 28px;
            font-weight: 600;
        }

        .title {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
        }

        .message {
            margin: 12px 0 0;
            font-size: 14px;
            line-height: 22px;
            color: #64748b;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 46px;
            margin-top: 28px;
            border-radius: 7px;
            border: 1px solid #1f2937;
            background: #1f2937;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }

        .button:hover {
            background: #111827;
        }

        .security-text {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #edf0f2;
            font-size: 12px;
            line-height: 18px;
            color: #89919c;
        }

        @media (max-width: 480px) {

           .container {
                padding: 15px;
            }
            .card {
                padding: 35px 24px;
            }
            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="error-icon">  ! </div>
            <h1 class="title">We catch a problem</h1>
            <p class="message"  th:text="${message}"> Something went wrong. Please try again. </p>
            <div class="security-text">  If the problem continues, please try again later.</div>
        </div>
    </div>
</body>

</html>
